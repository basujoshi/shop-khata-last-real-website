<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getDatabase,ref,get,onValue,update,push,set} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyCrkGEIgNlAsmOtWtrlCkelYrqDd7j-SoA',authDomain:'public-project-4d672.firebaseapp.com',databaseURL:'https://public-project-4d672-default-rtdb.firebaseio.com',projectId:'public-project-4d672',storageBucket:'public-project-4d672.firebasestorage.app',messagingSenderId:'265276656656',appId:'1:265276656656:web:c2bc539cab446e51b88e95',measurementId:'G-13XVC26YTQ'};
const db=getDatabase(initializeApp(firebaseConfig));
const cleanMobile=m=>String(m||'').replace(/\D/g,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const hashText=async text=>{const d=new TextEncoder().encode(text),h=await crypto.subtle.digest('SHA-256',d);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')};

const form=document.querySelector('#mobileForm'),results=document.querySelector('#results'),view=document.querySelector('#view');
let currentMobile='',indexData={},unsubscribe=null,currentKey='',currentUid='',lastState='',first=true;

function beep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function showPin(uid){results.innerHTML=`<div class="panel"><h2>Enter Digital PIN</h2><p>${esc(indexData[uid]?.shopName||'Shop')}</p><form id="pinForm" class="portal-form"><label><span>6-digit PIN</span><input id="pin" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required autofocus></label><button class="primary">Open Account</button><button type="button" class="secondary" id="back">Back</button></form></div>`;
document.querySelector('#back').onclick=()=>form.dispatchEvent(new Event('submit',{cancelable:true}));
document.querySelector('#pinForm').onsubmit=async e=>{e.preventDefault();const pin=document.querySelector('#pin').value.trim();if(!/^\d{6}$/.test(pin))return;try{const key=await hashText(currentMobile+'|'+pin),d=(await get(ref(db,`customerAccess/${key}`))).val(),shop=d?.shops?.[uid];if(!shop||cleanMobile(shop.account?.mobile)!==currentMobile){results.innerHTML='<div class="result-error"><b>Account not found</b><br>Wrong PIN.</div>';return}openLive(uid,key)}catch(x){results.innerHTML=`<div class="result-error">${esc(x.message)}</div>`}}}
function openLive(uid,key){currentUid=uid;currentKey=key;results.classList.add('hidden');view.classList.remove('hidden');if(unsubscribe)unsubscribe();const r=ref(db,`customerAccess/${key}/shops/${uid}`);unsubscribe=onValue(r,s=>{const shop=s.val();if(!shop){view.innerHTML='<div class="panel result-error"><b>Account unavailable</b></div>';return}const state=JSON.stringify(shop);if(!first&&state!==lastState)beep();first=false;lastState=state;render(shop)},e=>view.innerHTML=`<div class="panel result-error">${esc(e.message)}</div>`)}
function render(shop){const c=shop.account||{},tx=Object.values(c.transactions||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));let credit=0,paid=0,rows='';
tx.forEach(x=>{if(x.type==='credit')credit+=+x.amount||0;else paid+=+x.amount||0;const q=+x.qty||1,u=x.unit||'pcs',mrp=+x.mrp||0;rows+=`<tr><td>${esc(formatDateTime(x.createdAt,x.date))}</td><td>${esc(x.item||'Payment')}</td><td>${x.type==='credit'?money(mrp)+' / '+esc(u):'—'}</td><td>${x.type==='credit'?esc(q+' '+u):'—'}</td><td>${x.type==='credit'?money(x.amount):'-'+money(x.amount)}</td></tr>`});
const notes=Object.values(shop.notifications||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)),unread=notes.filter(n=>!n.read).length;
view.innerHTML=`<div class="panel"><div class="customer-headline"><div class="avatar shop-photo-avatar">${shop.shopPhoto?`<img src="${esc(shop.shopPhoto)}" alt="">`:'🏪'}</div><div><h2>${esc(shop.shopName||'Shop')}</h2><p>${esc(c.name||'Customer')} • ${esc(c.mobile||'')}</p><small style="color:#16a34a;font-weight:800">● LIVE REAL-TIME</small></div></div><div class="stats"><div class="stat"><small>Credit</small><strong>${money(credit)}</strong></div><div class="stat"><small>Paid</small><strong>${money(paid)}</strong></div><div class="stat"><small>Balance</small><strong>${money(credit-paid)}</strong></div></div></div>
<div class="panel"><h2>Transactions</h2><div class="tablewrap"><table><thead><tr><th>Date & Time</th><th>Item</th><th>Original Price</th><th>Qty</th><th>Total</th></tr></thead><tbody>${rows||'<tr><td colspan="5">No transactions</td></tr>'}</tbody></table></div></div>
<div class="panel"><h2>🔔 Notifications ${unread?`(${unread} new)`:''}</h2>${notes.length?notes.map(n=>`<div class="panel"><b>${esc(n.title||'Notification')}</b><small>${esc(formatDateTime(n.createdAt,''))}</small><p>${esc(n.message||'')}</p></div>`).join(''):'<p>No notifications yet.</p>'}</div>
<div class="panel"><h2>💬 Messages <span id="msgCount"></span></h2><div id="customerChat" class="chatbox"></div><form id="customerChatForm" class="chatform"><input id="customerChatInput" placeholder="Message shop..." autocomplete="off" required><button class="primary">Send</button></form></div>
<button class="secondary" id="logout">Back / Logout</button>`;
document.querySelector('#logout').onclick=()=>location.reload();
const chat=Object.values(shop.messages||{}).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));const cb=document.querySelector('#customerChat');cb.innerHTML=chat.length?chat.map(m=>`<div class="chatmsg ${m.sender==='customer'?'me':''}"><div>${esc(m.message||'')}</div><span class="chatmeta">${m.sender==='customer'?'You':'Shop'} • ${esc(formatDateTime(m.createdAt,''))}</span></div>`).join(''):'<p>No messages yet.</p>';cb.scrollTop=cb.scrollHeight;document.querySelector('#customerChatForm').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#customerChatInput'),msg=input.value.trim();if(!msg)return;const r=ref(db,`customerAccess/${currentKey}/shops/${currentUid}/messages`),id=push(r).key,now=Date.now();await set(ref(db,`customerAccess/${currentKey}/shops/${currentUid}/messages/${id}`),{sender:'customer',message:msg,createdAt:now,read:false});input.value='';};}
form.onsubmit=async e=>{e.preventDefault();if(unsubscribe)unsubscribe();currentMobile=cleanMobile(document.querySelector('#mobile').value);if(currentMobile.length<7){results.innerHTML='<div class="result-error"><b>Account not found</b></div>';return}results.innerHTML='<div class="panel">Checking...</div>';try{const h=await hashText(currentMobile),d=(await get(ref(db,`customerIndex/${h}`))).val()||{},shops=Object.entries(d).filter(([,x])=>x&&x.enabled!==false);if(!shops.length){results.innerHTML='<div class="result-error"><b>Account not found</b></div>';return}indexData=Object.fromEntries(shops);results.innerHTML=`<div class="panel"><h2>Select Shop</h2><div class="customer-grid">${shops.map(([uid,x])=>`<button class="customer-card" data-uid="${esc(uid)}"><div class="avatar shop-photo-avatar">${x.shopPhoto?`<img src="${esc(x.shopPhoto)}" alt="">`:'🏪'}</div><div><h3>${esc(x.shopName||'Shop')}</h3><small>Enter PIN for this shop</small></div><strong>›</strong></button>`).join('')}</div></div>`;document.querySelectorAll('[data-uid]').forEach(b=>b.onclick=()=>showPin(b.dataset.uid))}catch(x){results.innerHTML=`<div class="result-error">${esc(x.message)}</div>`}};
</script>
