<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KhataPro — Logout</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  font-family:Arial,system-ui,sans-serif;
  background:linear-gradient(135deg,#06101c,#0b1d31);
  color:#eef7ff;padding:20px
}
.card{
  width:min(430px,100%);text-align:center;
  background:#0d2034;border:1px solid #244661;
  border-radius:26px;padding:36px 25px;
  box-shadow:0 25px 70px #0008
}
.logo{
  width:72px;height:72px;margin:0 auto 18px;
  display:grid;place-items:center;border-radius:20px;
  background:linear-gradient(135deg,#35c5ff,#1759ed);
  font-size:34px;font-weight:900
}
h1{margin:0 0 10px;font-size:30px}
p{color:#9fb3c8;line-height:1.6}
button{
  width:100%;border:0;border-radius:13px;padding:15px;
  margin-top:12px;font-size:16px;font-weight:800;
  cursor:pointer;background:linear-gradient(135deg,#20aefe,#1666ed);
  color:white
}
.secondary{background:#ffffff0b;border:1px solid #ffffff18}
#status{min-height:25px;margin-top:15px;color:#7dd6ff}
</style>
</head>
<body>
<div class="card">
  <div class="logo">K</div>
  <h1>Logout from KhataPro?</h1>
  <p id="message">Are you sure you want to logout?</p>
  <button id="logoutBtn">🚪 Yes, Logout</button>
  <button class="secondary" id="cancelBtn">← Cancel</button>
  <div id="status"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth, signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCrGE...",
  authDomain: "public-project-4d672.firebaseapp.com",
  databaseURL: "https://public-project-4d672-default-rtdb.firebaseio.com",
  projectId: "public-project-4d672",
  storageBucket: "public-project-4d672.firebasestorage.app",
  messagingSenderId: "265276656656",
  appId: "1:265276656656:web:c2bc539cab446e51b88e95",
  measurementId: "G-13XVC26YTQ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const status = document.getElementById("status");
const message = document.getElementById("message");

document.getElementById("logoutBtn").onclick = async () => {
  const ok = confirm("Are you sure you want to logout?");
  if (!ok) return;

  status.textContent = "Logging out...";
  try {
    await signOut(auth);
    message.textContent = "You have been logged out successfully.";
    status.textContent = "Redirecting to login...";
    setTimeout(() => {
      location.replace("index.html");
    }, 700);
  } catch (error) {
    console.error(error);
    status.textContent = "Logout failed. Please try again.";
  }
};

document.getElementById("cancelBtn").onclick = () => {
  if (history.length > 1) history.back();
  else location.replace("dashboard.html");
};
</script>
</body>
</html>
