<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KhataPro Customer Manager</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#142033}.top{height:68px;background:#fff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:20px}.wrap{width:min(1000px,92%);margin:25px auto}.card{background:#fff;border:1px solid #e2e7ef;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 10px 35px #18304d0d}.head{display:flex;gap:15px;align-items:center}.avatar{width:65px;height:65px;border-radius:17px;background:#e9efff;display:grid;place-items:center;overflow:hidden;font-size:28px;font-weight:800;color:#3157e8}.avatar img{width:100%;height:100%;object-fit:cover}h1,h2{margin:0 0 8px}.muted{color:#718096}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:700;font-size:13px}input,textarea{width:100%;margin-top:7px;padding:12px;border:1px solid #d6ddea;border-radius:11px;outline:0}textarea{min-height:90px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#3157e8;color:#fff}.secondary{background:#edf2ff;color:#2948b9}.danger{background:#ffe8e8;color:#b42318}.status{margin-top:10px;color:#087443}.error{color:#b42318}.chat{max-height:360px;overflow:auto;background:#f7f9fc;padding:12px;border-radius:14px}.msg{max-width:82%;padding:10px 13px;border-radius:13px;background:#fff;border:1px solid #e2e7ef;margin:7px 0}.msg.owner{margin-left:auto;background:#eef4ff}.meta{display:block;font-size:11px;color:#8792a5;margin-top:4px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:11px;border-bottom:1px solid #e6eaf0;text-align:left}th{font-size:12px;color:#6b778c;background:#f8fafc}.live{color:#07865a;font-weight:800}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{padding:0 3%}}
</style></head><body><header class="top"><div class="brand">K KhataPro • Customer</div><button class="secondary" onclick="location.href='customers.html'">Customers</button></header><main class="wrap"><div id="status" class="card">Checking login…</div><section id="app" class="hidden">
<div class="card"><div class="head"><div id="photo" class="avatar">👤</div><div><h1 id="name">Customer</h1><div id="summary" class="muted"></div><div class="live">● LIVE SYNC</div></div></div></div>
<div class="card"><h2>✏️ Edit Customer Details</h2><p class="muted">Save here and the Customer Portal will update automatically.</p><div class="grid"><label>Name<input id="nameInput"></label><label>Mobile<input id="mobileInput" inputmode="tel"></label><label>Address<input id="addressInput"></label><label>Photo URL<input id="photoInput" placeholder="https://..."></label><label>6-digit Digital PIN<input id="pinInput" maxlength="6" inputmode="numeric" placeholder="Leave unchanged"></label><label>Email<input id="emailInput" type="email"></label></div><div class="actions"><button id="save" class="primary">Save Changes</button></div><div id="saveStatus"></div></div>
<div class="card"><h2>💬 Messages</h2><div id="chat" class="chat"></div><div class="actions"><input id="messageInput" placeholder="Message customer…" style="flex:1;min-width:220px"><button id="send" class="primary">Send</button></div></div>
<div class="card"><h2>🧾 Transactions</h2><div class="table"><table><thead><tr><th>Date</th><th>Item</th><th>Original Price</th><th>Qty</th><th>Total</th></tr></thead><tbody id="tx"></tbody></table></div></div>
</section></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getDatabase,ref,get,onValue,set,push,update,remove}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
const cfg={apiKey:'AIzaSyCrkGEIgNlAsmOtWtrlCkelYrqDd7j-SoA',authDomain:'public-project-4d672.firebaseapp.com',databaseURL:'https://public-project-4d672-default-rtdb.firebaseio.com',projectId:'public-project-4d672',storageBucket:'public-project-4d672.firebasestorage.app',messagingSenderId:'265276656656',appId:'1:265276656656:web:c2bc539cab446e51b88e95'};const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);const $=id=>document.getElementById(id);const cid=new URLSearchParams(location.search).get('id');let uid,customer,oldKey='',stop;
const clean=m=>String(m||'').replace(/\D/g,'');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hash=async s=>{let h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')};const time=t=>new Date(t||Date.now()).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'});const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
async function portalKey(m,p){return hash(clean(m)+'|'+p)}
async function syncPortal(c,oldAccess,newAccess){const shop=(await get(ref(db,`shops/${uid}/shop`))).val()||{};if(oldAccess&&oldAccess!==newAccess)await remove(ref(db,`customerAccess/${oldAccess}`));
if(clean(c.mobile)!==clean(customer.mobile)) { const oldMh=await hash(clean(customer.mobile)); await remove(ref(db,`customerIndex/${oldMh}/${uid}`)); }const existing=(await get(ref(db,`customerAccess/${newAccess}`))).val()||{};await set(ref(db,`customerAccess/${newAccess}`),{enabled:true,shops:{...(existing.shops||{}),[uid]:{shopName:shop.shopName||'Shop',shopPhoto:shop.shopPhoto||'',customerId:cid,account:{name:c.name||'',mobile:c.mobile||'',address:c.address||'',photo:c.photo||'',email:c.email||'',customerPin:c.customerPin||'',customerAccessKey:newAccess,transactions:c.transactions||{}},notifications:c.notifications||{},messages:{...(existing.shops?.[uid]?.messages||{}),...(c.messages||{})}}}});const mh=await hash(clean(c.mobile));await update(ref(db,`customerIndex/${mh}`),{[uid]:{enabled:true,shopName:shop.shopName||'Shop',shopPhoto:shop.shopPhoto||'',mobile:clean(c.mobile)}});}
function render(c){$('name').textContent=c.name||'Customer';$('summary').textContent=`📱 ${c.mobile||''}${c.address?' • 📍 '+c.address:''}`;$('nameInput').value=c.name||'';$('mobileInput').value=c.mobile||'';$('addressInput').value=c.address||'';$('photoInput').value=c.photo||'';$('emailInput').value=c.email||'';$('pinInput').value='';$('photo').innerHTML=c.photo?`<img src="${esc(c.photo)}">`:'👤';const rows=Object.values(c.transactions||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$('tx').innerHTML=rows.map(x=>`<tr><td>${esc(time(x.createdAt))}</td><td>${esc(x.item||'Payment')}</td><td>${x.type==='credit'?money(x.mrp)+' / '+esc(x.unit||'pcs'):'—'}</td><td>${x.type==='credit'?esc((x.qty||1)+' '+(x.unit||'pcs')):'—'}</td><td>${x.type==='credit'?money(x.amount):'-'+money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="5">No transactions</td></tr>';renderChat(c.messages||{})}
function renderChat(m){const a=Object.values(m||{}).sort((x,y)=>(x.createdAt||0)-(y.createdAt||0));$('chat').innerHTML=a.map(x=>`<div class="msg ${x.sender==='owner'?'owner':''}">${esc(x.message||'')}<span class="meta">${x.sender==='owner'?'You':'Customer'} • ${esc(time(x.createdAt))}</span></div>`).join('')||'<div class="muted">No messages yet.</div>';$('chat').scrollTop=$('chat').scrollHeight}
async function save(){const name=$('nameInput').value.trim(),mobile=clean($('mobileInput').value),pin=$('pinInput').value.trim();if(!name||mobile.length<7){$('saveStatus').className='error';$('saveStatus').textContent='Name and valid mobile required.';return}if(pin&&(!/^\d{6}$/.test(pin))){$('saveStatus').className='error';$('saveStatus').textContent='PIN must be exactly 6 digits.';return}const oldMobile=clean(customer.mobile),oldPin=customer.customerPin||'';const oldAccess=oldKey||await portalKey(oldMobile,oldPin);const newPin=pin||oldPin;if(!newPin){$('saveStatus').className='error';$('saveStatus').textContent='Digital PIN is required for portal access.';return}const newAccess=await portalKey(mobile,newPin);const patch={name,mobile,address:$('addressInput').value.trim(),photo:$('photoInput').value.trim(),email:$('emailInput').value.trim(),customerPin:newPin,customerAccessKey:newAccess,updatedAt:Date.now()};await update(ref(db,`shops/${uid}/customers/${cid}`),patch);customer={...customer,...patch};await syncPortal(customer,oldAccess,newAccess);oldKey=newAccess;render(customer);$('saveStatus').className='status';$('saveStatus').textContent='Saved ✓ Customer Portal updated live.'}
$('save').onclick=save;$('send').onclick=async()=>{const msg=$('messageInput').value.trim();if(!msg)return;const p=ref(db,`shops/${uid}/customers/${cid}/messages`),id=push(p).key,createdAt=Date.now();await set(ref(db,`shops/${uid}/customers/${cid}/messages/${id}`),{sender:'owner',message:msg,createdAt,read:false});const n=push(ref(db,`shops/${uid}/customers/${cid}/notifications`)).key;await set(ref(db,`shops/${uid}/customers/${cid}/notifications/${n}`),{title:'MESSAGE FROM SHOP',message:msg,createdAt,read:false,type:'message'});$('messageInput').value=''};
onAuthStateChanged(auth,async u=>{if(!u){$('status').innerHTML='<b>Login required.</b><br>Open KhataPro and login first.';return}uid=u.uid;if(!cid){$('status').textContent='Customer ID missing.';return}const snap=await get(ref(db,`shops/${uid}/customers/${cid}`));customer=snap.val();if(!customer){$('status').textContent='Customer not found.';return}oldKey=customer.customerAccessKey||await portalKey(customer.mobile,customer.customerPin||'');$('status').classList.add('hidden');$('app').classList.remove('hidden');render(customer);if(stop)stop();stop=onValue(ref(db,`shops/${uid}/customers/${cid}`),s=>{const x=s.val();if(x){customer=x;render(x)}});onValue(ref(db,`customerAccess/${oldKey}/shops/${uid}/messages`),s=>{if(customer){customer.messages={...(customer.messages||{}),...(s.val()||{})};renderChat(customer.messages)}})});
</script></body></html>
