<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard • KhataPro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="brand mini" href="dashboard.html">
    <span class="brandmark">K</span>
    <span><b>KhataPro</b><small id="shopTitle">My Shop</small></span>
  </a>
  <div class="top-right">
    <select id="languageSelect" class="lang">
      <option value="en">EN</option>
      <option value="ne">ने</option>
    </select>
    <a class="ghost" href="shop-settings.html" data-i18n="settings">Shop Settings</a>
    <button type="button" class="ghost" id="logoutBtn" data-i18n="logout">Logout</button>
  </div>
</header>

<main class="wrap">
<section class="hero">
<div>
<p class="eyebrow" data-i18n="dashboardTitle">Business Dashboard</p>
<h1 id="welcome">Welcome</h1>
<p id="shopMeta" data-i18n="overview">Business overview</p>
</div>
<a class="primary btn" href="add-customer.html">＋ <span data-i18n="newCustomer">New Customer</span></a>
</section>

<section class="stats">
<div class="stat"><small data-i18n="totalCustomers">Total Customers</small><strong id="customersCount">0</strong></div>
<div class="stat"><small data-i18n="totalCredit">Total Credit</small><strong id="dueTotal">रू 0</strong></div>
<div class="stat"><small data-i18n="totalPaid">Total Paid</small><strong id="paidTotal">रू 0</strong></div>
<div class="stat"><small data-i18n="transactions">Transactions</small><strong id="txCount">0</strong></div>
</section>

<section class="grid2">
<div class="panel">
<h2 data-i18n="quickActions">Quick Actions</h2>
<div class="actions">
<a href="add-customer.html" class="action">➕ <span data-i18n="newCustomer">New Customer</span></a>
<a href="customers.html" class="action">👥 <span data-i18n="customers">Customers</span></a>
<button type="button" id="logoutActionBtn" class="action">🔐 <span data-i18n="logout">Logout</span></button>
<a href="reports.html" class="action">📊 <span data-i18n="reports">Reports</span></a>
</div>
</div>

<div class="panel">
<h2 data-i18n="shop">Shop</h2>
<div id="shopCard" class="shopcard">Loading...</div>
</div>
</section>

<section class="panel">
<div class="panel-head">
<h2 data-i18n="recentCustomers">Recent Customers</h2>
<a class="secondary btn" href="customers.html" data-i18n="viewAll">View all</a>
</div>
<div id="recent" class="list"></div>
</section>
</main>

<nav class="mobile-nav">
<a href="dashboard.html"><span>⌂</span><span data-i18n="home">Home</span></a>
<a href="customers.html"><span>👥</span><span data-i18n="customers">Customers</span></a>
<a href="add-customer.html"><span>＋</span><span data-i18n="addCustomer">Add</span></a>
<a href="reports.html"><span>▦</span><span data-i18n="reports">Reports</span></a>
<a href="shop-settings.html"><span>⚙</span><span data-i18n="settings">Settings</span></a>
</nav>

<script type="module" src="js/dashboard.js"></script>
<script type="module">
import { initLanguage, logout } from './js/common.js';

initLanguage();

async function doLogout() {
  const ok = confirm(
    document.documentElement.lang === 'ne'
      ? 'के तपाईं Logout गर्न निश्चित हुनुहुन्छ?'
      : 'Are you sure you want to logout?'
  );
  if (!ok) return;

  const buttons = [
    document.getElementById('logoutBtn'),
    document.getElementById('logoutActionBtn')
  ].filter(Boolean);

  buttons.forEach(b => {
    b.disabled = true;
    b.style.opacity = '.6';
    b.style.pointerEvents = 'none';
  });

  try {
    await logout();
  } catch (err) {
    console.error('Logout failed:', err);
    buttons.forEach(b => {
      b.disabled = false;
      b.style.opacity = '';
      b.style.pointerEvents = '';
    });
    alert('Logout failed. Please try again.');
  }
}

document.getElementById('logoutBtn').addEventListener('click', doLogout);
document.getElementById('logoutActionBtn').addEventListener('click', doLogout);
</script>
</body>
</html>
